name: Smart Complaint CI

on:
  push:
    branches: [ "dev", "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run linting checks
        run: |
          cd backend
          python -m py_compile app/main.py
          python -m py_compile app/models/models.py
          echo "✅ Python syntax check passed"

      - name: Verify imports
        run: |
          cd backend
          python -c "import app.main; print('✅ Main module imports successfully')"
          python -c "import app.models.models; print('✅ Models module imports successfully')"
          python -c "import app.core.config; print('✅ Config module imports successfully')"

      - name: Build status
        run: |
          echo "✅ Smart Complaint System backend build successful!"
          echo "✅ All modules compile and import correctly"